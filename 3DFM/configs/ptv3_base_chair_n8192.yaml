data:
  data_mode: pointflow
  data_root: 3DFM/src/data/ShapeNetCore.v2.PC15k
  category: Chair
  split: train
  pointflow_part: all
  pointflow_normalize: global
  shape_index: 0
  num_shapes: 0
  num_points: 8192
  target_subsample: random
  target_order: shuffle

model:
  arch: ptv3_base
  ptv3_grid_size: 0.01
  ptv3_time_dim: 32
  ptv3_patch_size: 128

training:
  batch_size: 1
  epochs: 300
  lr: 2.0e-4
  weight_decay: 0.0
  lr_gamma: 0.99
  ema_decay: 0.9999
  aux_weight: 0.0
  seed: 42
  log_every: 100
  sample_every: 1000
  device: auto

sampling:
  nfe: 64

output:
  out_dir: runs/ptv3_base_chair_n8192
